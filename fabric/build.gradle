plugins {
    id 'fabric-loom' version '1.4.+'
    id 'maven-publish'
}

version = '1.2.0'
group = 'com.mard.pixel'

base {
    archivesName = 'mard_pixel_fabric'
}

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.15.11"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.1+1.20.1"
}

// 禁用mixin remap，兼容loom 1.4.x
loom {
    mixin {
        useLegacyMixinRemap = false
    }
}

// 移除sourceSets配置，shared目录的文件将直接复制到src/main/java下
// （在workflow中通过cp命令完成复制）

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
