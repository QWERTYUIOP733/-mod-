plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.+'
}

group = 'com.mard.pixel'
version = '2.0.0'

base {
    archivesName = 'mard_pixel_forge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                mard_pixel {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                mard_pixel {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDir '../shared/java'
        }
        resources {
            srcDir '../shared'
            exclude 'java/**'
        }
    }
}

repositories {
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'http://127.0.0.1:8899/maven/'; allowInsecureProtocol = true }
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.1.16'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'mard_pixel',
            'Specification-Version'   : '2.0.0',
            'Implementation-Title'    : 'Color Blocks Extension',
            'Implementation-Version'  : '2.0.0'
        ])
    }
    from("LICENSE") {
        rename { "${it}_mard_pixel_forge" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
