plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '7.0.40'
}

group = 'com.mard.pixel'
version = '2.1.0'

base {
    archivesName = 'mard_pixel_forge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.4'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.enabledGameTestNamespaces', 'mard_pixel'
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

sourceSets {
    main {
        java {
            srcDir '../shared/java'
        }
        resources {
            srcDir '../shared'
            exclude 'java/**'
        }
    }
}

repositories {
    // ForgeGradle 7 / 1.21.4 必需的 Mojang/Forge 仓库
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    // 国内镜像（加速常规依赖）
    maven { url = 'https://maven.aliyun.com/repository/public' }
    maven { url = 'http://127.0.0.1:8899/maven/'; allowInsecureProtocol = true }
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:1.21.4-54.1.17')
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'mard_pixel',
            'Specification-Version'   : '2.1.0',
            'Implementation-Title'    : 'Color Blocks Extension',
            'Implementation-Version'  : '2.1.0'
        ])
    }
    from("LICENSE") {
        rename { "${it}_mard_pixel_forge" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
