plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

group = 'com.mard.pixel'
version = '3.0.0'

base {
    archivesName = 'mard_pixel_forge'
}

// Mojang ships Java 25 to end users in 26.1+
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

minecraft {
    // 26.1 起游戏主体不再混淆，Forge 无需再配置 mappings channel/version。
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.enabledGameTestNamespaces', 'mard_pixel'
        }
        register('client')
        register('server') {
            args '--nogui'
        }
    }
}

sourceSets {
    main {
        java {
            srcDir '../shared/java'
        }
        resources {
            srcDir '../shared'
            exclude 'java/**'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    // Forge maven 走本地反向代理（bmclapi_proxy.ps1，监听 127.0.0.1:8920）。
    // 代理固定第一跳到 BMCLAPI 国内节点并跟随其全部 302（CERNET/高校镜像），
    // 规避官方 Cloudflare 挂起与动态镜像主机 DNS 问题。构建前须先启动该代理。
    maven { url = 'http://127.0.0.1:8920/maven/' }
    // 国内镜像（加速常规依赖）
    maven { url = 'https://maven.aliyun.com/repository/public' }
    mavenCentral()

    // 无论 FG 在何时加入 fg.forgeMaven，都把官方 Forge 域名 / BMCLAPI 域名统一改写到本地代理，
    // 确保 mavenizer 命令行 --repository MinecraftForge 指向代理。
    all { repo ->
        if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
            def u = repo.url?.toString() ?: ''
            if (u.contains('maven.minecraftforge.net') || u.contains('bmclapi2.bangbang93.com')) {
                repo.url = uri('http://127.0.0.1:8920/maven/')
            } else if (u.contains('repo.maven.apache.org')) {
                // Maven Central 走 Cloudflare 国内易超时，统一改写到阿里云公共仓库
                repo.url = uri('https://maven.aliyun.com/repository/public/')
            }
        }
    }
}

// 兜底：FG 若在 afterEvaluate 阶段才固化 forgeMaven 地址，再统一改写一次。
afterEvaluate {
    repositories.each { repo ->
        if (repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository) {
            def u = repo.url?.toString() ?: ''
            if (u.contains('maven.minecraftforge.net') || u.contains('bmclapi2.bangbang93.com')) {
                repo.url = uri('http://127.0.0.1:8920/maven/')
            } else if (u.contains('repo.maven.apache.org')) {
                repo.url = uri('https://maven.aliyun.com/repository/public/')
            }
        }
    }
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.9')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'mard_pixel',
            'Specification-Version'   : '3.0.0',
            'Implementation-Title'    : 'Color Blocks Extension',
            'Implementation-Version'  : '3.0.0'
        ])
    }
    from("LICENSE") {
        rename { "${it}_mard_pixel_forge" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}
