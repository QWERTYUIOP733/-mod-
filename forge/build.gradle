plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.54'
}

group = 'com.mard.pixel'
version = '1.2.1'

base {
    archivesName = 'mard_pixel_forge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                mard_pixel {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            mods {
                mard_pixel {
                    source sourceSets.main
                }
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDir '../shared/java'
        }
        resources {
            srcDir '../shared'
            exclude 'java/**'
        }
    }
}

repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    mavenCentral()
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.23'
}

jar {
    manifest {
        attributes([
            'Specification-Title'     : 'mard_pixel',
            'Specification-Version'   : '1.2.1',
            'Implementation-Title'    : 'Color Blocks Extension',
            'Implementation-Version'  : '1.2.1'
        ])
    }
    from("LICENSE") {
        rename { "${it}_mard_pixel_forge" }
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}
