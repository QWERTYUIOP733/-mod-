org.gradle.jvmargs=-Xmx6G -XX:+UseG1GC
org.gradle.daemon=false
org.gradle.parallel=true
# 禁用 ForgeGradle 启动时对 Forge/Mojang 官方的 HEAD 探活（国内连 Cloudflare 无超时会永久卡死）
systemProp.fg.check.certs=false
systemProp.net.minecraftforge.gradle.check.certs=false
# --- CI 构建参数（.github/workflows/build.yml 经 tools/ci-meta.js 读取）---
# 本分支 Minecraft 1.21.1 对应 JDK 21 / Gradle 8.8
ci.javaVersion=21
ci.gradleVersion=8.8
