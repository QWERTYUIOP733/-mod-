org.gradle.jvmargs=-Xmx6G -XX:+UseG1GC
org.gradle.daemon=false
org.gradle.parallel=true
# 禁用 ForgeGradle 启动时对 Forge/Mojang 官方的 HEAD 探活（国内连 Cloudflare 无超时会永久卡死）
systemProp.fg.check.certs=false
systemProp.net.minecraftforge.gradle.check.certs=false
# ForgeGradle 7：合并 source sets（1.21+ 官方无独立 client sourceSet）
net.minecraftforge.gradle.merge-source-sets=true
# 显式告知 Gradle 本机 JDK 位置（D 盘自定义路径不在默认探测范围）
# jdk-21 用于编译/运行 target；FG7 mavenizer 与 SlimeLauncher(runClient) 需要 jdk-8；
# FG7 部分内部任务还会请求 jdk-25 toolchain
org.gradle.java.installations.paths=D:/dev/jdk-8,D:/dev/jdk-21,D:/dev/jdk-25
