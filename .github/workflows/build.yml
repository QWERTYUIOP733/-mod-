name: Build MARD Pixel Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-forge:
    name: Build Forge (1.20.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate 295 blockstates + item models + lang
        run: node tools/generate_resources.js

      - name: Build Forge mod
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build --no-daemon
          build-root-directory: forge
          gradle-version: '8.8'

      - name: Upload Forge jar
        uses: actions/upload-artifact@v4
        with:
          name: MARD_Pixel_Forge_1.20.1
          path: forge/build/libs/*.jar
          retention-days: 30

  build-fabric:
    name: Build Fabric (1.20.1)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate 295 blockstates + item models + lang
        run: node tools/generate_resources.js

      - name: Copy shared sources to Fabric (workaround for loom sourceSets issue)
        run: |
          mkdir -p fabric/src/main/java
          mkdir -p fabric/src/main/resources
          cp -r shared/java/* fabric/src/main/java/
          if [ -d "shared/assets" ]; then cp -r shared/assets fabric/src/main/resources/; fi
          if [ -d "shared/brands" ]; then cp -r shared/brands fabric/src/main/resources/; fi
          echo "Shared files copied to Fabric src directory"
          ls -la fabric/src/main/java/com/mard/pixel/common/ | head -20

      - name: Build Fabric mod
        uses: gradle/gradle-build-action@v3
        with:
          arguments: build --no-daemon
          build-root-directory: fabric
          gradle-version: '8.8'

      - name: Upload Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: MARD_Pixel_Fabric_1.20.1
          path: fabric/build/libs/*.jar
          retention-days: 30
